name: Isolated wallet settlement integration test

on:
  pull_request:
    paths:
      - "database/**"
      - ".github/workflows/wallet-settlement-integration.yml"
  push:
    branches:
      - "fix/cash-commission-debt-settlement"
    paths:
      - "database/**"
      - ".github/workflows/wallet-settlement-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wallet-settlement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: nhacarro_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nhacarro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: nhacarro_test
      PGUSER: postgres
      PGPASSWORD: test-only-password
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Supabase-compatible roles and auth stubs in isolated PostgreSQL
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN;"
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE authenticated NOLOGIN;"
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE service_role NOLOGIN BYPASSRLS;"
          psql -v ON_ERROR_STOP=1 -c "CREATE SCHEMA IF NOT EXISTS auth;"
          psql -v ON_ERROR_STOP=1 -c "CREATE SCHEMA IF NOT EXISTS private;"
          psql -v ON_ERROR_STOP=1 -c "CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS \\$\\$ SELECT nullif(current_setting('request.jwt.claim.sub', true), '')::uuid \\$\\$;"
          psql -v ON_ERROR_STOP=1 -c "CREATE OR REPLACE FUNCTION auth.role() RETURNS text LANGUAGE sql STABLE AS \\$\\$ SELECT coalesce(current_setting('request.jwt.claim.role', true), current_user) \\$\\$;"

      - name: Create base schema with PostGIS
        run: |
          psql -v ON_ERROR_STOP=1 -f database/001_initial_schema.sql
          psql -v ON_ERROR_STOP=1 -c "CREATE OR REPLACE FUNCTION private.my_role() RETURNS text LANGUAGE sql STABLE AS \\$\\$ SELECT coalesce((SELECT u.tipo_perfil::text FROM public.usuarios u WHERE u.id = auth.uid()), 'ANON') \\$\\$;"

      - name: Apply migrations 009 through 017 to ephemeral database only
        run: |
          for migration in \
            database/009_wallet_authoritative_settlement.sql \
            database/010_fix_driver_acceptance_trigger.sql \
            database/011_test_wallet_topup.sql \
            database/012_allow_service_role_protected_updates.sql \
            database/013_create_wallet_topups.sql \
            database/014_harden_wallet_topups.sql \
            database/015_confirm_wallet_topup.sql \
            database/016_wallet_topup_rpc_wrapper.sql \
            database/017_cash_payment_correction.sql; do
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Apply settlement migration to ephemeral database only
        run: psql -v ON_ERROR_STOP=1 -f database/018_cash_commission_debt_settlement.sql

      - name: Verify cash debt and electronic settlement idempotency
        run: psql -v ON_ERROR_STOP=1 -f database/tests/018_cash_commission_debt_idempotency.sql
