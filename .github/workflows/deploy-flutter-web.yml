name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Inject Google Maps API key
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          if [ -z "$GOOGLE_MAPS_API_KEY" ]; then
            echo "::error::Repository secret GOOGLE_MAPS_API_KEY is missing."
            exit 1
          fi
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path("web/index.html")
          content = path.read_text(encoding="utf-8")
          placeholder = "__GOOGLE_MAPS_API_KEY__"
          if content.count(placeholder) != 1:
              raise SystemExit("Expected exactly one Google Maps key placeholder in web/index.html")
          path.write_text(content.replace(placeholder, os.environ["GOOGLE_MAPS_API_KEY"]), encoding="utf-8")
          PY

      - name: Build Flutter Web
        run: flutter build web --release --base-href "/nha_carro/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
