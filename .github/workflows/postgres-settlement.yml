name: PostgreSQL settlement integration

on:
  pull_request:
    paths:
      - "tests/postgres/**"
      - ".github/workflows/postgres-settlement.yml"
  push:
    branches:
      - "test/postgres-ride-settlement-idempotency"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  settlement-integration:
    name: Isolated PostgreSQL concurrency tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nhacarro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nhacarro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Run concurrent settlement tests
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: nhacarro_test
        run: bash tests/postgres/ride-settlement-concurrency.sh
